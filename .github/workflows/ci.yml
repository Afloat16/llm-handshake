name: Tests and portable executable

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and loopback integration tests
        run: python scripts/run_tests.py
      - name: Build standalone executable
        run: python scripts/build_zipapp.py
      - name: Isolated no-provider smoke test
        run: python -I dist/llm-handshake.pyz demo --strict
      - name: Install source package
        run: python -m pip install .
      - name: Installed console command
        run: llm-handshake demo --strict
