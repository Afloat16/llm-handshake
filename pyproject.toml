[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-handshake"
version = "0.1.0"
description = "Small, dependency-free compatibility checks for LLM endpoints."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Afloat16" }]
keywords = ["llm", "openai-compatible", "diagnostics", "streaming", "compatibility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
dev = ["coverage>=7.6,<8"]

[project.scripts]
llm-handshake = "llm_handshake.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llm_handshake = ["py.typed"]

[tool.coverage.run]
source = ["llm_handshake"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
